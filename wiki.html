<script>
var P={"index": "# RAG LLM Wiki — 目錄\n\n主題：RAG（檢索增強生成）。共 5 個來源、8 個概念頁。規則見 [CLAUDE.md](CLAUDE.md)，討論結論見 [discussion.md](discussion.md)，操作紀錄見 [log.md](log.md)。\n\n## 概念頁（簡報只能用這些）\n- [[rag-overview]] — RAG 是什麼？為什麼需要？\n- [[rag-pipeline]] — 一次 RAG 怎麼跑\n- [[embeddings-vector-db]] — Embedding 與向量資料庫\n- [[chunking-and-contextual-retrieval]] — 切塊與 Contextual Retrieval\n- [[rag-paradigms]] — Naive / Advanced / Modular\n- [[rag-evaluation]] — 怎麼評估\n- [[rag-vs-alternatives]] — 什麼時候該用\n- [[limits-and-risks]] — 限制與風險\n\n## 來源頁\n- [[S1]] Lewis et al. 2020 原始論文\n- [[S2]] AWS：What is RAG ＋ Prescriptive Guidance\n- [[S3]] Anthropic：Contextual Retrieval\n- [[S4]] RAGAS 評估框架\n- [[S5]] Gao et al. RAG Survey\n", "discussion": "# 先討論（Discuss before Generate）\n\n> 說明：本作業由使用者授權 Claude 自行決定主題並協助完成，以下是「生成 Wiki 之前」先定下的決策。\n\n## 決策\n- 主題：RAG。理由：與課程（RAG chatbot、Agent）銜接，且資料來源權威、可交叉驗證。\n- 目標讀者：沒聽過 RAG、但知道 ChatGPT 之類 LLM 的人。\n- 簡報要回答的 5 個問題（Wiki 結構由此反推）：\n  - Q1 RAG 是什麼？為什麼需要？ → `concepts/rag-overview`\n  - Q2 一次 RAG 查詢怎麼跑？ → `concepts/rag-pipeline`、`concepts/embeddings-vector-db`\n  - Q3 怎麼讓檢索更準？ → `concepts/chunking-and-contextual-retrieval`、`concepts/rag-paradigms`\n  - Q4 怎麼知道 RAG 好不好、什麼時候不用？ → `concepts/rag-evaluation`、`concepts/rag-vs-alternatives`、`concepts/limits-and-risks`\n  - Q5 一句話帶走什麼？ → 由以上整理\n- 來源選擇原則：原始論文 1 + 綜述 1 + 雲端廠商教學 1 + 業界工程實作 1 + 評估方法 1，彼此角度互補。\n  - S1 Lewis et al. 2020（原始論文） S2 AWS（工程流程） S3 Anthropic Contextual Retrieval（進階檢索） S4 RAGAS（評估） S5 Gao et al. Survey（分類與全貌）\n- 約定：只有 Wiki 概念頁可以進簡報；簡報裡每一頁都要標 `data-wiki`。\n", "CLAUDE": "# RAG LLM Wiki — Schema（維護規則）\n\n主題：RAG（Retrieval-Augmented Generation，檢索增強生成）\n語言：繁體中文；專有名詞保留英文。\n\n## 目錄\n- `sources/S1..S5.md`：來源頁。每個來源一頁，記錄書目資訊 + 以自己的話改寫的重點（不貼原文）。\n- `concepts/*.md`：概念頁。由來源頁「編譯」而成，是簡報唯一允許使用的知識來源。\n- `index.md`：全部頁面目錄。`log.md`：操作紀錄。`discussion.md`：先討論的結論。\n\n## 寫作規則（lint 會自動檢查）\n1. 概念頁每一條 bullet 結尾必須有 `[S#]` 出處標記；純屬編者推論的句子改標 `[推論]`。\n2. `[S#]` 必須對應存在的 `sources/S#.md`。\n3. 概念頁中出現的數字（百分比、2 位數以上數字）必須出現在其所引用的來源頁中。\n4. `[[page]]` 連結必須指向存在的頁面。\n5. 不得整句抄原文；一律改寫。\n\n## 三種操作\n- Ingest：取得資料 → 寫來源頁 → 更新相關概念頁 → 更新 index/log\n- Query：只從 concepts/ 取材回答，並回報用了哪些頁面\n- Lint：跑 `lint.py`，不通過就回到 Ingest/編譯修正\n", "loop-graph": "# Loop / Graph 設計說明\n\n## 流程圖\n```mermaid\nflowchart TD\n  N1[N1 規劃：定義簡報要回答的問題 Q1~Q5] --> N2\n  N2[N2 取得資料：搜尋並取得來源] --> N3\n  N3[N3 Ingest：改寫成來源頁 S#] --> N4\n  N4{N4 出處檢查：數字/引述是否來自一手來源？} -- 否，標註為轉述或刪除 --> N3\n  N4 -- 是 --> N3b{還有來源要 ingest？}\n  N3b -- 是，迴圈 A（5 次） --> N2\n  N3b -- 否 --> N5[N5 編譯概念頁，每條事實標 S#]\n  N5 --> N6{N6 Wiki lint：出處、數字、連結、index}\n  N6 -- 失敗 --> N5\n  N6 -- 通過 --> N7[N7 Query：每張投影片只查 Wiki]\n  N7 --> N8[N8 產生簡報，每張標 data-wiki]\n  N8 --> N9{N9 簡報 lint ＋ 人工逐句核對}\n  N9 -- 失敗，迴圈 B（最多 3 輪） --> N7\n  N9 -- 通過 --> N10[N10 發布並留下檢查紀錄]\n```\n\n## 節點說明\n| 節點 | 做什麼 | 檢查什麼 |\n|---|---|---|\n| N1 規劃 | 先列出簡報要回答的 5 個問題，再反推 Wiki 要有哪些頁面 | 每個問題都對應到至少一個概念頁 |\n| N2 取得資料 | 每個來源各搜一次，優先原始論文與官方文件 | 選正式網址，不選翻譯頁或轉貼頁 |\n| N3 Ingest | 把來源改寫成 `sources/S#.md`，不貼原文 | 出處是否一手 |\n| N4 出處檢查 | 數字、百分比、專有名詞是否真的出自該來源 | 只見於二手轉述的數字要標註或刪除 |\n| N5 編譯 | 把來源頁整理成 `concepts/*.md`，每條事實結尾標 `[S#]` | 無出處的句子只能標 `[推論]` |\n| N6 Wiki lint | `lint.py wiki` 自動檢查 | 出處標記、`[S#]` 是否存在、數字是否出現在所引來源、連結、index |\n| N7 Query | 每張投影片只准從 Wiki 取材 | 回報用了哪些頁面 |\n| N8 產生簡報 | 每張 `<section>` 加 `data-wiki` 與來源標示 | — |\n| N9 簡報檢查 | `lint.py slides` ＋ 人工逐句比對 | 每張都有 data-wiki、頁面存在、數字在引用頁中；語氣不超出 Wiki |\n\n## 哪些步驟會重複？\n- 迴圈 A（N2→N3→N4）：每個來源跑一次，共 5 次。\n- 迴圈 B（N5→N6、N7→N8→N9）：lint 失敗就回去修，直到通過；簡報這邊上限 3 輪，避免無限修改。\n\n## 哪裡需要檢查或重新生成？\n- N4：來源頁寫完立刻檢查出處，有問題只重寫該來源頁。\n- N6：Wiki 不通過就重編譯，不進入做簡報。\n- N9：簡報有錯只回到 N7 重查、重寫對應的投影片，不用整份重做。\n\n## 為什麼這樣設計？\n1. 簡報只能讀 Wiki、不能自己補充，所以只要 Wiki 乾淨，簡報就有據可查。\n2. 檢查越早越便宜：來源頁錯一個數字，後面 8 個概念頁與 7 張投影片都可能跟著錯；在 N4、N6 擋下，只要改 1 處。\n3. 用自動檢查（數字、出處、連結）處理機械性錯誤，用人工逐句核對處理語氣與推論過度，兩者互補。\n4. 檢查器本身也可能有 bug，所以寫完檢查器後要做一次負向測試（故意塞錯，確認它會擋）。\n", "run-log": "# 一次實際執行的結果與檢查紀錄（2026-11-22）\n\n## 執行摘要\n- 主題：RAG；來源 5 篇；來源頁 5、概念頁 8；簡報 7 張。\n- 最終：`lint.py wiki` ✅、`lint.py slides` ✅（7 張）。\n\n## 逐節點紀錄\n| 節點 | 發生的事 | 結果 |\n|---|---|---|\n| N1 規劃 | 定下 Q1~Q5 與 5 個互補來源（原始論文／雲端教學／業界工程／評估／綜述） | 完成，見 discussion.md |\n| N2 取得資料 | 5 次搜尋。AWS 那次回傳同一頁的多種語言版本；Survey 那次回傳 arXiv 的 v1~v5 與不同網址 | 各選一個正式網址作為來源 |\n| N3 Ingest | 第 1 次寫入來源頁時，shell 沒有展開 `{sources,concepts}`，建出一個名稱含大括號的資料夾，5 個來源頁寫入失敗（錯誤訊息：Directory nonexistent） | 刪掉錯誤資料夾、重建、重寫，成功 |\n| N4 出處檢查 | Anthropic 的 reranking 成效「67%」在 Anthropic 頁面有寫，但絕對值「5.7% → 1.9%」只在 DataCamp 的教學轉述裡看到 | 在 S3 的 F3.6 明寫「DataCamp 轉述」；Wiki 與簡報只用 67% |\n| N5 編譯 | 產生 8 個概念頁，共 68 條 bullet | 完成 |\n| N6 Wiki lint（第 1 次） | ❌ 8 筆「缺少出處標記」，全部是「相關：[[連結]]」導覽行 | 判定為 lint 規則太嚴（誤判），不是內容錯；改為導覽行只檢查連結 |\n| N6 Wiki lint（第 2 次） | ✅ 通過；數字檢查 0 筆不符 | 通過 |\n| N8 產生簡報 | 7 張，每張標 data-wiki 與來源 | 完成 |\n| N9 簡報 lint（第 1 次） | ✅ 通過，但只檢查了 6 張（應為 7 張） | 發現是檢查器 bug：第 1 張 class 是 `slide on`，正規表示式沒匹配到，等於漏檢 |\n| N9 簡報 lint（第 2 次） | 修正後 ✅，檢查 7 張 | 通過 |\n| N9 負向測試 | 把簡報的 67% 改成 87% 再跑檢查 | ❌ 正確擋下：slide 4 數字 87% 不在其引用的 Wiki 頁中 |\n| N9 人工核對 | 逐句比對 7 張投影片與 Wiki；長條圖寬度以 3.7/5.7≈65%、2.9/5.7≈51% 自行驗算 | 發現 1 處措辭過強：「RAG 才有優勢」，Wiki 只說知識庫變大後 RAG 才有價值、可依權限控管，改成「RAG 更能發揮價值」；改完 lint 再跑 ✅ |\n| N9 補強規則 | 為了避免再發生「假通過」，在簡報 lint 加入：匹配到的投影片數必須等於頁面 `<section>` 總數，否則報錯；並用舊版正規表示式做回歸測試 | 舊版重現時正確報錯「只匹配到 6 張，但頁面共有 7 張」；新版 ✅ |\n\n## 沒有做到的事（誠實說明）\n- lint 只能驗證「數字、出處、連結、結構」，無法判斷句子語意是否忠於來源，這部分靠人工逐句核對。\n- 來源內容來自搜尋結果的摘錄片段，不是逐頁通讀全文；因此 Wiki 只收錄摘錄中有明確依據的事實。\n", "reflection": "# 反思\n\n## 哪個節點最常出錯？\n這次最常出錯的是「檢查節點本身」。實際執行中共出現 3 次問題，其中 2 次來自檢查器，1 次來自寫檔：\n1. Wiki lint 規則太嚴，把導覽行誤判成缺出處（8 筆誤報）。\n2. 簡報 lint 的正規表示式漏掉第 1 張投影片，結果顯示「通過」，其實少檢查了一張——這種「假通過」比報錯更危險。\n3. 建資料夾時 shell 沒展開大括號，導致來源頁寫入失敗。\n內容層面的錯誤（數字、出處）在這次執行中沒有被檢查器抓到，因為 N4 已在來源階段處理了 1 個風險點（只見於二手轉述的 1.9%）。\n\n## 我把檢查往前移到哪裡？\n- 把「出處檢查」放在 N4（Ingest 之後、編譯之前），而不是等簡報做完才查。原因是 1.9% 這種問題在來源頁就能處理，晚到簡報階段才發現，要回頭改來源頁、概念頁、投影片 3 個地方。\n- 把「Wiki lint」放在 N6（產生簡報之前）。簡報檢查只能對照 Wiki，若 Wiki 本身有錯，簡報檢查會把錯誤當成正確依據。\n\n## 有沒有因此修改 workflow / graph？為什麼？\n有，共修改 3 處：\n1. 新增「負向測試」：寫完任何檢查器，都要故意塞一個錯誤驗證它會擋（這次用 67%→87%）。原因是第 2 次問題讓我發現「通過」不等於「真的檢查過」，所以簡報 lint 現在會輸出「檢查了幾張」，數量不符就視為失敗。\n2. 在 N9 加入「人工逐句核對」。原因是自動檢查抓不到語氣過強（例如「才有優勢」），這類問題只能人工比對。\n3. 調整 lint 規則：導覽行改成只檢查連結，其餘事實句一律要有 `[S#]` 或 `[推論]`。這讓規則更貼近「事實一定要有出處」的原意，而不是形式上每一行都要標記。\n\n## 下一次會改進的地方\n- 來源改成逐頁通讀全文再 ingest，而不只依賴搜尋摘錄。\n- 把簡報句子也拆成「一句一條出處」，讓人工核對可以更快。\n", "log": "# Wiki 操作紀錄\n- 2026-11-22 discuss：決定主題 RAG、目標讀者、簡報要回答的 5 個問題、5 個來源（見 discussion.md）\n- 2026-11-22 ingest S1：Lewis et al. 2020 → sources/S1.md\n- 2026-11-22 ingest S2：AWS What is RAG ＋ Prescriptive Guidance → sources/S2.md\n- 2026-11-22 ingest S3：Anthropic Contextual Retrieval → sources/S3.md（67% 之後的 1.9% 僅見於 DataCamp 轉述，已在 F3.6 註明）\n- 2026-11-22 ingest S4：RAGAS → sources/S4.md\n- 2026-11-22 ingest S5：Gao et al. Survey → sources/S5.md\n- 2026-11-22 compile：產生 8 個概念頁與 index.md\n- 2026-11-22 lint：第 1 次 ❌（8 筆，皆為導覽行誤判）→ 修規則 → 第 2 次 ✅\n", "concepts-chunking-and-contextual-retrieval": "---\ntitle: 切塊與 Contextual Retrieval（讓檢索更準）\nsources: [S2, S3, S5]\n---\n- 為什麼要切塊：文件要先切成 chunk，再逐塊做 embedding 與檢索。[S2][S3]\n- 切塊的副作用：chunk 單獨看會缺少上下文（例如沒寫是哪家公司、哪個期間），因此可能檢索不到對的資訊。[S3]\n- Contextual Retrieval 的做法：在 embedding 與建 BM25 索引之前，先替每個 chunk 補上一段簡短的專屬說明，通常 50–100 tokens，由 LLM 產生。[S3]\n- 它包含兩部分：Contextual Embeddings 與 Contextual BM25。[S3]\n- 成效（top-20 檢索失敗率）：只用 Contextual Embeddings 降低 35%（5.7% → 3.7%）。[S3]\n- 再加 Contextual BM25 降低 49%（5.7% → 2.9%）；再加 reranking 降低 67%。[S3]\n- 成本面：prompt caching 可降低替每個 chunk 產生說明的成本。[S3]\n- 調參重點：chunk 的大小、邊界、重疊，以及 embedding 模型的選擇都會影響檢索表現。[S3]\n- 在綜述的分類裡，reranking（重排序）屬於 Advanced RAG 的常見模組。[S5]\n- 相關：[[rag-paradigms]]\n", "concepts-embeddings-vector-db": "---\ntitle: Embedding 與向量資料庫\nsources: [S1, S2, S3]\n---\n- Embedding 是文字的數值表示，用來捕捉文字的語意。[S2]\n- 向量資料庫是 embeddings 的資料庫，也稱 vector store 或 vector index；索引內含 embeddings、對應文字與 metadata。[S2]\n- 文件與使用者問題都要轉成相容的數值格式，才能比較「相不相關」。[S2]\n- 搜尋靠語意相似度，而不是只比對關鍵字。[S3]\n- 原始論文的做法：用稠密向量索引加上 MIPS（最大內積搜尋）找出最相關的文件。[S1]\n- 另一條路是 BM25：以 TF-IDF 為基礎的詞彙比對；實務上常和 embeddings 搭配一起檢索。[S3]\n- 相關：[[rag-pipeline]]、[[chunking-and-contextual-retrieval]]\n", "concepts-limits-and-risks": "---\ntitle: RAG 的限制與風險\nsources: [S2, S3, S4]\n---\n- 規模變大後，要準確取回 context 變困難，會連帶拉低生成品質。[S2]\n- 切塊會讓 chunk 失去上下文，導致檢索失敗。[S3]\n- 即使加上 Contextual Embeddings 與 Contextual BM25，top-20 檢索失敗率仍有 2.9%，檢索不可能百分之百。[S3]\n- 外部資料會過時，要持續更新文件與 embeddings。[S2]\n- 敏感資料需要權限控管，不能讓所有人檢索到所有內容。[S2]\n- 效果取決於檢索模型、語料、LM、提示等多個環節，需要反覆調校與評估。[S4]\n- 實務心法：答錯時先分辨是「沒檢索到」還是「檢索到但沒用好」，再對症下藥。[推論]\n- 相關：[[rag-evaluation]]\n", "concepts-rag-evaluation": "---\ntitle: 怎麼評估一個 RAG 好不好？\nsources: [S4, S5]\n---\n- RAG 由「檢索」與「生成」兩個模組組成，所以要分別檢查。[S4]\n- 表現會受檢索模型、語料、LM 與提示寫法影響，需要大量調校，因此自動評估很重要。[S4]\n- RAGAS 是不需要人工標準答案的自動評估框架。[S4]\n- 三個常用面向：忠實度 Faithfulness（答案有沒有根據 context）、答案相關性 Answer Relevance（有沒有回答到問題）、脈絡相關性 Context Relevance（取回的內容是否聚焦）。[S4]\n- 衡量方式：用提示請 LLM 判斷。例如忠實度會先抽出答案中的陳述，再逐一檢查能否由 context 推得。[S4]\n- 另一個框架 ARES 同樣回報這三項分數。[S4]\n- 綜述也把評估指標與基準列為 RAG 研究的一部分。[S5]\n- 評估本身仰賴 LLM 判斷，所以重要結論仍建議人工抽查。[推論]\n- 相關：[[limits-and-risks]]\n", "concepts-rag-overview": "---\ntitle: RAG 是什麼？為什麼需要？\nsources: [S1, S2, S3, S5]\n---\n- 一句話：RAG 就是「先查資料、再回答」——先從外部知識庫取回相關內容，連同問題一起交給 LLM 產生答案。[S2][S3]\n- 正式定義：讓 LLM 在回答前先參考訓練資料以外的權威知識庫，藉此優化輸出。[S2]\n- 為什麼需要：LLM 的知識存在參數裡且訓練資料有截止日期，沒答案時還可能編出錯誤資訊。[S2]\n- 學界也歸納出三個痛點：幻覺、知識過時、回答不透明且難追溯。[S5]\n- 兩種記憶：LLM 本身的知識是「參數記憶」，外部可檢索的資料是「非參數記憶」；RAG 把兩者結合。[S1]\n- 好處一：不必重新訓練模型，就能延伸到特定領域或組織內部知識庫。[S2]\n- 好處二：想更新知識，只要替換外部索引（資料），不用動模型。[S1][S2]\n- 好處三：取回的內容可以檢視，所以答案比較能追溯出處。[S1]\n- 起源：RAG 一詞最早由 Lewis 等人於 2020 年提出。[S5]\n- 生活類比：RAG 像「開書考試」——不靠死背，而是考前先翻到對的那一頁再作答。[推論]\n- 接下來看：[[rag-pipeline]]\n", "concepts-rag-paradigms": "---\ntitle: RAG 的三個世代：Naive / Advanced / Modular\nsources: [S5]\n---\n- 綜述把 RAG 的發展分成三種範式：Naive RAG、Advanced RAG、Modular RAG。[S5]\n- Naive RAG：索引、檢索、生成三步走（Retrieve-Read），以語意相似度取回文件 chunk。[S5]\n- Advanced RAG：資料處理更精細、索引更最佳化，並採用多次或迭代檢索；常加入查詢改寫、重排序（rerank）、提示摘要等模組。[S5]\n- Modular RAG：把流程拆成可替換、可重組的模組，彈性更高；例如 FLARE、Self-RAG 會依情境判斷「這題需不需要檢索」。[S5]\n- 為什麼會演進：Advanced 與 Modular 是為了解決 Naive RAG 的特定缺點。[S5]\n- 趨勢：結合結構化與非結構化資料的混合檢索，以及與微調整合。[S5]\n- 相關：[[chunking-and-contextual-retrieval]]、[[rag-evaluation]]\n", "concepts-rag-pipeline": "---\ntitle: 一次 RAG 怎麼跑？（流程）\nsources: [S1, S2, S3, S5]\n---\n- 整體分兩段：離線「建索引」只做一次；線上「查詢」依需求反覆執行。[S2]\n- 步驟 1 準備資料：蒐集文件，做清理、格式化與切塊（chunk）。[S2]\n- 步驟 2 向量化並入庫：用 embedding 模型把每個 chunk 轉成數值向量，存進向量資料庫。[S2][S3]\n- 步驟 3 檢索（Retrieve）：使用者用自然語言提問，問題同樣轉成向量，在向量資料庫做相似度搜尋並取回相關資料。[S2]\n- 步驟 4 增強（Augment）：把取回的內容（context）附加到含問題的提示裡。[S2][S3]\n- 步驟 5 生成（Generate）：LLM 根據問題加上 context 產生回答。[S2]\n- 學術對照：Naive RAG 的三步「索引、檢索、生成」，就是上面流程的濃縮版，也稱 Retrieve-Read。[S5]\n- 原始論文版本：檢索器用 DPR，生成器用 BART，並以 MIPS 取回 top-K 相關段落。[S1]\n- 維護提醒：外部資料更新後，要同步更新其 embeddings，可用即時處理或定期批次處理。[S2]\n- 相關：[[embeddings-vector-db]]、[[chunking-and-contextual-retrieval]]\n", "concepts-rag-vs-alternatives": "---\ntitle: 什麼時候該用 RAG？\nsources: [S1, S2, S3]\n---\n- 知識庫很小（小於 200,000 tokens，約 500 頁）時，可以直接整份放進提示，不一定需要 RAG。[S3]\n- 知識庫變大後，就需要更可擴展的做法，這時 RAG 才有價值。[S3]\n- 和「重新訓練模型」相比，RAG 不必重訓就能接上特定領域資料。[S2]\n- 知識常常變動時，RAG 只要換索引、更新 embeddings，就能讓答案跟上。[S1][S2]\n- 需要依使用者權限控管敏感資訊時，可在檢索階段依授權層級限制內容。[S2]\n- 相關：[[rag-overview]]、[[limits-and-risks]]\n", "S1": "---\nid: S1\ntitle: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks\nauthors: Lewis et al.（Facebook AI Research / UCL / NYU）\nvenue: NeurIPS 2020，arXiv:2005.11401\nurl: https://arxiv.org/abs/2005.11401\nretrieved: 2026-11-22\n---\n## 改寫重點\n- F1.1 問題：預訓練語言模型把知識存在參數裡，難以擴充或修改記憶、難以說明答案出處，也可能產生「幻覺」。\n- F1.2 做法：把「參數記憶」（預訓練 seq2seq 模型 BART）與「非參數記憶」（維基百科的稠密向量索引）結合，用預訓練的神經檢索器 DPR 去存取。\n- F1.3 流程：依輸入 x 檢索 top-K 相關段落 z，生成器再同時參考 x 與 z 產生輸出 y；以 Maximum Inner Product Search（MIPS）找最相關文件。\n- F1.4 兩種變體：RAG-Sequence 整段輸出使用同一批檢索段落；RAG-Token 每個 token 可用不同段落。\n- F1.5 結果：在 Natural Questions、WebQuestions、CuratedTrec 三個開放領域問答達到當時最佳；生成內容比純參數式 BART 基準更具體、多樣、符合事實；FEVER 事實查核與最佳 pipeline 模型差距在 4.3% 內。\n- F1.6 知識更新：替換非參數記憶（索引）即可更新模型所用的知識。\n- F1.7 程式碼已開源於 HuggingFace Transformers。\n- F1.8 此論文把檢索得到的文件視為隱變數，檢索器與生成器可一起端到端訓練。\n", "S2": "---\nid: S2\ntitle: What is RAG? ＋ Understanding Retrieval Augmented Generation（AWS Prescriptive Guidance）\nauthors: Amazon Web Services\nvenue: AWS 說明文件\nurl: https://aws.amazon.com/what-is/retrieval-augmented-generation\nretrieved: 2026-11-22\n---\n## 改寫重點\n- F2.1 定義：RAG 讓 LLM 在產生回答前，先參考訓練資料之外的權威知識庫，以優化輸出。\n- F2.2 不必重新訓練模型，就能把 LLM 延伸到特定領域或組織內部知識庫，是具成本效益的做法。\n- F2.3 LLM 的挑戰：沒有答案時可能給出錯誤資訊；訓練資料是靜態的，因此有知識截止日期。\n- F2.4 RAG 四步驟：(1) 建立 embeddings 並匯入向量資料庫（含資料清理、格式化、切塊，只做一次）；(2) 使用者用自然語言提問；(3) orchestrator 在向量資料庫做相似度搜尋，取回相關資料（context）並加進提示；(4) orchestrator 把問題與 context 交給 LLM 產生回答。第 1 步只做一次，其餘三步依需求重複執行。\n- F2.5 Embedding 是文字的數值表示，用來捕捉語意；向量資料庫是 embeddings 的資料庫，也稱 vector store 或 vector index，其索引含 embeddings、對應文字與 metadata。\n- F2.6 文件與使用者查詢都要轉成相容的格式（由 embedding 模型轉為數值表示），才能做相關性搜尋。\n- F2.7 外部資料會過時：可用非同步方式更新文件與其 embeddings，方式可為自動即時處理或定期批次處理。\n- F2.8 語意搜尋能在大量資料中更準確地取回資料，可改善 RAG 結果；規模變大時，context 檢索變困難，進而降低生成品質。\n- F2.9 生產級 RAG 的元件：connectors（連接資料來源）、data processing（處理 PDF、掃描檔等）、embeddings、retriever（取回並依需求排序）、foundation model（通常是 LLM）、vector database、身分與使用者管理。\n- F2.10 可依授權層級限制敏感資訊的檢索。\n", "S3": "---\nid: S3\ntitle: Introducing Contextual Retrieval\nauthors: Anthropic\nvenue: Anthropic 工程部落格（含 DataCamp 教學轉述的數字）\nurl: https://www.anthropic.com/engineering/contextual-retrieval\nretrieved: 2026-11-22\n---\n## 改寫重點\n- F3.1 RAG 從知識庫取回相關資訊並附加到使用者的提示中，以強化回答。\n- F3.2 傳統 RAG 的弱點：切塊後的 chunk 缺少上下文（例如沒寫是哪家公司、哪個期間），常導致取不到對的資訊。\n- F3.3 若知識庫小於 200,000 tokens（約 500 頁），可直接整份放進提示，不一定需要 RAG；知識庫變大才需要更可擴展的做法。\n- F3.4 標準 RAG：把文件切成 chunk、產生 embeddings、存入可做語意相似搜尋的向量資料庫；常再搭配 BM25（以 TF-IDF 為基礎的詞彙比對）一起檢索。\n- F3.5 Contextual Retrieval 由 Contextual Embeddings 與 Contextual BM25 組成：在做 embedding 與建 BM25 索引之前，先替每個 chunk 加上一段 chunk 專屬的簡短說明（通常 50–100 tokens），由 Claude 產生。\n- F3.6 成效（top-20 chunk 檢索失敗率）：只用 Contextual Embeddings，降低 35%（5.7% → 3.7%）；再加 Contextual BM25，降低 49%（5.7% → 2.9%）；再加 reranking，降低 67%（DataCamp 教學轉述為 5.7% → 1.9%）。\n- F3.7 Prompt caching 可降低替每個 chunk 產生說明的成本。\n- F3.8 實作考量：chunk 的大小、邊界與重疊會影響檢索表現；embedding 模型的選擇也有影響（文中提到 Gemini 與 Voyage 表現特別好）。\n", "S4": "---\nid: S4\ntitle: Ragas: Automated Evaluation of Retrieval Augmented Generation\nauthors: Es, James, Espinosa-Anke, Schockaert\nvenue: EACL 2024 demo，arXiv:2309.15217\nurl: https://arxiv.org/abs/2309.15217\nretrieved: 2026-11-22\n---\n## 改寫重點\n- F4.1 RAGAS（Retrieval Augmented Generation Assessment）是不需要人工標準答案的（reference-free）RAG 自動評估框架。\n- F4.2 RAG 系統由檢索模組與 LLM 生成模組組成；表現會受檢索模型、語料、LM 與提示寫法影響，需要大量調校，所以自動評估很重要。\n- F4.3 三個品質面向：Faithfulness（忠實度）——答案中的主張能由給定 context 推得，避免幻覺；Answer Relevance（答案相關性）——答案是否直接回應問題，不看事實對錯，但會扣不完整或冗餘；Context Relevance（脈絡相關性）——取回的 context 應聚焦，盡量少含無關資訊。\n- F4.4 衡量方式是用提示請 LLM 判斷：忠實度先讓 LLM 抽出答案中的陳述，再檢查各陳述能否由 context 推得；答案相關性則讓 LLM 由答案反推可能的問題，再比較與原問題的 embedding 餘弦相似度。\n- F4.5 另一個框架 ARES 同樣回報 context relevance、answer faithfulness、answer relevance 三項分數。\n", "S5": "---\nid: S5\ntitle: Retrieval-Augmented Generation for Large Language Models: A Survey\nauthors: Gao et al.（同濟大學、復旦大學等）\nvenue: arXiv:2312.10997\nurl: https://arxiv.org/abs/2312.10997\nretrieved: 2026-11-22\n---\n## 改寫重點\n- F5.1 這是一篇 RAG 綜述，整理 Naive RAG、Advanced RAG、Modular RAG 三種範式，以及檢索（retrieval）、生成（generation）、增強（augmentation）三大組成與評估。\n- F5.2 LLM 的挑戰：幻覺、知識過時、回答不透明且難追溯；RAG 先從外部知識庫取回相關資訊再回答，藉此改善。\n- F5.3 RAG 一詞最早由 Lewis 等人於 2020 年提出。\n- F5.4 Naive RAG：索引（indexing）、檢索（retrieval）、生成（generation）三步，也稱「Retrieve-Read」；以語意相似度從外部知識庫取回文件 chunk。\n- F5.5 Advanced RAG：更精細的資料處理、最佳化索引、多次或迭代檢索；加入查詢改寫、chunk 重排序（rerank）、提示摘要等模組。\n- F5.6 Modular RAG：新增模組並可重組流程，彈性更高；例如 FLARE、Self-RAG 這類自適應檢索，會依情境判斷是否需要檢索。\n- F5.7 Advanced 與 Modular RAG 的出現，是為了回應 Naive RAG 的特定缺點。\n- F5.8 趨勢：結合結構化與非結構化資料的混合檢索，以及與微調整合。\n"},A={"index": "index", "discussion": "discussion", "CLAUDE": "CLAUDE", "loop-graph": "loop-graph", "run-log": "run-log", "reflection": "reflection", "log": "log", "concepts-chunking-and-contextual-retrieval": "concepts-chunking-and-contextual-retrieval", "chunking-and-contextual-retrieval": "concepts-chunking-and-contextual-retrieval", "concepts-embeddings-vector-db": "concepts-embeddings-vector-db", "embeddings-vector-db": "concepts-embeddings-vector-db", "concepts-limits-and-risks": "concepts-limits-and-risks", "limits-and-risks": "concepts-limits-and-risks", "concepts-rag-evaluation": "concepts-rag-evaluation", "rag-evaluation": "concepts-rag-evaluation", "concepts-rag-overview": "concepts-rag-overview", "rag-overview": "concepts-rag-overview", "concepts-rag-paradigms": "concepts-rag-paradigms", "rag-paradigms": "concepts-rag-paradigms", "concepts-rag-pipeline": "concepts-rag-pipeline", "rag-pipeline": "concepts-rag-pipeline", "concepts-rag-vs-alternatives": "concepts-rag-vs-alternatives", "rag-vs-alternatives": "concepts-rag-vs-alternatives", "S1": "S1", "S2": "S2", "S3": "S3", "S4": "S4", "S5": "S5"},T={"index": "目錄", "discussion": "先討論", "CLAUDE": "Schema 規則", "loop-graph": "Loop/Graph 設計", "run-log": "執行紀錄", "reflection": "反思", "log": "操作紀錄"};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){s=esc(s);
 s=s.replace(/\[\[(.*?)\]\]/g,function(m,n){var k=A[n];return k?'<a href="#'+k+'">'+n+'</a>':n});
 s=s.replace(/\[(S\d)\]/g,function(m,n){return '<a class="b" href="#'+n+'">'+n+'</a>'}).replace(/\[推論\]/g,'<span class="b i">推論</span>');
 s=s.replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/`(.*?)`/g,"<code>$1</code>");
 s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
 s=s.replace(/\[([^\]]+)\]\(([A-Za-z]+)\.md\)/g,function(m,t,n){return '<a href="#'+(A[n]||'index')+'">'+t+'</a>'});return s}
function md(t){var o=[],L=t.split("\n"),i=0,fm=null;
 if(L[0]==="---"){var e=L.indexOf("---",1);fm=L.slice(1,e).join("\n");i=e+1;o.push('<div class="meta">'+esc(fm)+'</div>')}
 var ul=false,tb=false;
 function cl(){if(ul){o.push("</ul>");ul=false}if(tb){o.push("</table></div>");tb=false}}
 for(;i<L.length;i++){var l=L[i];
  if(l.indexOf("```")===0){cl();var c=[];i++;while(i<L.length&&L[i].indexOf("```")!==0){c.push(L[i]);i++}o.push("<pre><code>"+esc(c.join("\n"))+"</code></pre>");continue}
  var h=/^(#{1,3}) (.*)/.exec(l);if(h){cl();o.push("<h"+h[1].length+">"+inl(h[2])+"</h"+h[1].length+">");continue}
  if(l.indexOf("|")===0){if(/^\|[-| ]+\|$/.test(l))continue;if(!tb){cl();o.push('<div class="tw"><table>');tb=true}
   o.push("<tr>"+l.split("|").slice(1,-1).map(function(x){return "<td>"+inl(x.trim())+"</td>"}).join("")+"</tr>");continue}
  if(l.indexOf("- ")===0){if(!ul){cl();o.push("<ul>");ul=true}o.push("<li>"+inl(l.slice(2))+"</li>");continue}
  if(/^> /.test(l)){cl();o.push("<p class='meta'>"+inl(l.slice(2))+"</p>");continue}
  if(l.trim()===""){cl();continue}cl();o.push("<p>"+inl(l)+"</p>")}
 cl();return o.join("\n")}
